name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Error: HF_TOKEN secret is not set!"
            exit 1
          fi
          
          if [ -z "$HF_REPO" ]; then
            echo "Error: HF_REPO secret is not set! Please set it to username/space-name"
            exit 1
          fi

          echo "Pushing to Hugging Face Space: $HF_REPO"
          
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Add Hugging Face remote with the token for authentication
          git remote add space https://user:$HF_TOKEN@huggingface.co/spaces/$HF_REPO
          
          # Push the code
          git push --force space main
